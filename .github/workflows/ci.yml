name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
      - name: Validate notebook JSON
        run: >-
          python -c "import json, pathlib;
          json.loads(pathlib.Path('notebooks/01_dataset_audit.ipynb').read_text())"

  # The quality job runs without torch, so the torch, OpenCV, httpx and ffmpeg tests
  # skip there. This job installs them and fails if any test still skips. Versions
  # match the training machine (CPU builds of the same torch release).
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install CPU torch and the training and inference extras
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,train,inference]" transformers==4.57.6 httpx
      - name: Test with nothing skipped
        shell: bash
        run: |
          python -m pytest -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then
            echo "Some tests skipped; every dependency should be installed here."
            exit 1
          fi
