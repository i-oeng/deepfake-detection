dataset:
  name: openworld_fresh_v4
  version: "fresh-v4-20261103"
  data_root: data/raw/fresh_v4_images
  # Fresh test-only set for round 4, from sources no earlier split used. Built
  # by scripts/rebuild-fresh-v4 (deepfake_detection.data.fresh_v4, then
  # openworld materialize); photos repeating earlier data or each other are dropped.
  metadata_path: ../../subsets/openworld_fresh_v4/catalog.csv
  output_root: data/manifests
  report_root: reports/data_audit
  id_column: image_id
  label_column: label
  split_column: split
  path_column: relative_path
  metadata_columns:
    - source_domain
    - manipulation_family
    - fake_method
    - video_id
    - identity_id
    - compression
    - source_video_id
    - target_identity_id
    - lineage_video_ids
    - frame_index
    - source_path
    - archive
    - preprocess
  group_columns: [video_id, identity_id]
  leakage_check_columns: [source_domain, manipulation_family, fake_method]
  expected_labels: [REAL, FAKE]
  expected_splits: [test]
  workers: 8
  quality_gates:
    max_missing_images: 0
    max_decode_errors: 0
    max_ambiguous_paths: 0
    max_cross_split_exact_groups: 0
    max_cross_split_pixel_groups: 0
    max_cross_split_perceptual_groups: 0
    max_group_overlap_values: 0
    fail_on_unexpected_labels: true
    fail_on_unexpected_splits: true
    fail_on_suspicious_leakage: false
    leakage_purity_threshold: 0.98
