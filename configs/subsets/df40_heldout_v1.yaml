subset:
  name: df40_heldout_v1
  source_dataset: df40
  # Output of `deepfake-data partition-df40-heldout` against the frozen
  # unseen-method manifest 07f906d9ef61a537efa8. Every row is `test`.
  source_metadata: data/raw/df40/metadata_heldout_v1.csv
  output_root: data/subsets
  seed: "20261006"
  id_column: image_id
  path_column: relative_path
  label_column: label
  split_column: split
  method_column: fake_method
  family_column: manipulation_family
  domain_column: source_domain
  frame_order_column: frame_index
  group_columns: [video_id, identity_id, image_id]
  fake_label: FAKE
  real_label: REAL
  real_to_fake_ratio: 1.0
  require_disjoint_train_test_methods: false
  require_disjoint_all_methods: false
  # Seen methods have no CelebA rows and StarGANv2 has no FF++/CDF rows, so
  # those per-domain quotas are expected to be empty. `audit-heldout` enforces
  # the pre-registered video counts for every real protocol cell instead.
  strict_quotas: false
  splits:
    test:
      fake_methods: [simswap, blendface, wav2lip, sadtalker, stylegan2, sd21, dit, starganv2]
      max_images_per_method: 300
      # P1: 20 FF++ videos, P2: 10 Celeb-DF videos, P3: 300 single CelebA images.
      max_images_per_method_by_domain: {ff: 160, cdf: 80, celeba: 300}
      max_groups_per_method: 300
      max_frames_per_group: 8
