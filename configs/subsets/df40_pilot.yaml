subset:
  name: df40_pilot_v1
  source_dataset: df40
  source_metadata: data/raw/df40/metadata.csv
  output_root: data/subsets
  seed: "20260925"

  # The normalized catalog must use these canonical columns. fake_method values
  # are lowercase slugs so method selection is stable across source layouts.
  id_column: image_id
  path_column: relative_path
  label_column: label
  split_column: split
  method_column: fake_method
  family_column: manipulation_family
  domain_column: source_domain
  frame_order_column: frame_index
  group_columns: [video_id, identity_id, image_id]

  fake_label: FAKE
  real_label: REAL
  real_to_fake_ratio: 1.0
  require_disjoint_train_test_methods: true

  # Keep false for the first catalog inspection: any unavailable quota is
  # recorded in subset.json. Switch to true before freezing report experiments.
  strict_quotas: false

  # Target: at most 10 frames per video and a balanced real sample from the
  # same source domain. Caps are per fake method, not per manipulation family.
  splits:
    train:
      fake_methods: [simswap, wav2lip, stylegan2, sd21]
      max_images_per_method: 2500
      max_groups_per_method: 2500
      max_frames_per_group: 10
    validation:
      fake_methods: [simswap, wav2lip, stylegan2, sd21]
      max_images_per_method: 500
      max_groups_per_method: 500
      max_frames_per_group: 10
    test:
      fake_methods: [blendface, sadtalker, dit, starganv2]
      max_images_per_method: 1000
      max_groups_per_method: 1000
      max_frames_per_group: 10
